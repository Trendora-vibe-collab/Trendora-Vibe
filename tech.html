<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tech | Trendora Vibe</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #f5f7f8;
      color: #252525;
      font-family: Arial, sans-serif;
    }

    header {
      background: #252525;
      padding: 20px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: #f5f0e7;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    nav a {
      color: #f5f0e7;
      text-decoration: none;
      margin-left: 25px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    nav a:hover {
      color: #c6a86b;
    }

    .hero {
      text-align: center;
      padding: 70px 20px 45px;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 17px;
      color: #666;
    }

    .products {
      display: flex;
      justify-content: center;
      padding: 20px 7% 70px;
    }

    .card {
      background: white;
      width: 320px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .card img {
      width: 100%;
      display: block;
    }

    .info {
      padding: 22px;
    }

    .info h2 {
      margin-bottom: 10px;
    }

    .info p {
      color: #666;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .shop {
      display: inline-block;
      background: #252525;
      color: white;
      text-decoration: none;
      padding: 12px 20px;
      border-radius: 5px;
      font-weight: bold;
    }

    .shop:hover {
      background: #c6a86b;
    }

    footer {
      text-align: center;
      padding: 25px;
      background: #252525;
      color: #f5f0e7;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">TRENDORA VIBE</div>

  <nav>
    <a href="index.html">Home</a>
    <a href="jewelry.html">Jewelry</a>
    <a href="tech.html">Tech</a>
  </nav>
    
</header>

<section class="hero">
  <h1>Tech Collection</h1>
  <p>Smart, useful and stylish tech finds for everyday life.</p>
</section>

<section class="products">

  <div class="card">
    <img src="f105e4ccbfae3d395078f96a5e5fc8db.jpg" alt="Yellow Watch">

    <div class="info">
      <h2>Yellow Watch</h2>
      <p>Stylish and practical tech for everyday life.</p>

      <a class="shop" href="https://s.click.aliexpress.com/e/_c3gNeBkr">
        Shop Now
      </a>
    </div>
  </div>

</section>

<footer>
  © 2026 Trendora Vibe. All rights reserved.
</footer>

</body>
</html>
